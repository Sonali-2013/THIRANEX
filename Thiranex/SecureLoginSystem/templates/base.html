<!DOCTYPE html>
<html>

<head>

    <title>Secure Login System</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

{% with messages = get_flashed_messages() %}

    {% if messages %}

        {% for message in messages %}

            <div class="flash-message">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}

{% endwith %}

{% block content %}

{% endblock %}

</body>

</html>
